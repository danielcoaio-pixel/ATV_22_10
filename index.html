<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Filmes</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input, select {
            display: block;
            margin-bottom: 10px;
            padding: 5px;
        }

        /* Ajuste para que os radios fiquem inline com as labels */
        .radio-group input[type="radio"] {
            display: inline-block;
            margin-bottom: 0;
        }

        button {
            padding: 5px 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        li {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>Cadastro de notas de filmes</h1>

    <form id="formulario">
        <label for="nome">Nome do filme:</label>
        <input type="text" id="nome" required>

        <label for="genero">Gênero:</label>
        <select id="genero" required>
            <option value="">Escolha um gênero</option>
            <option value="Ação">Ação</option>
            <option value="Comédia">Comédia</option>
            <option value="Terror">Terror</option>
            <option value="Drama">Drama</option>
            <option value="Animação">Animação</option>
        </select>
        
        <label for="nota">Nota da avaliação (1 a 10):</label>
        <input type="number" id="nota" min="1" max="10" required>

        <label>Assistiria novamente?:</label>
        <div class="radio-group">
            <input type="radio" id="option1" name="assistiria" value="Sim" required>
            <label for="option1" style="display:inline;">Sim</label>
            <br>
            <input type="radio" id="option2" name="assistiria" value="Não">
            <label for="option2" style="display:inline;">Não</label>
        </div>

        <button type="submit">Enviar</button>
    </form>

    <h2>Registros</h2>

    <ol id="listaFilmes"></ol>

    <script>
        let filmes = [];

        const formulario = document.getElementById("formulario");
        const lista = document.getElementById("listaFilmes");

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            // Captura os valores do formulário
            let nome = document.getElementById("nome").value;
            let genero = document.getElementById("genero").value;
            let nota = document.getElementById("nota").value;
            
            // Captura o valor do radio button selecionado
            let assistiria = document.querySelector('input[name="assistiria"]:checked').value;

            // Cria o objeto filme
            let filme = {
                nome: nome,
                genero: genero,
                nota: nota,
                assistiria: assistiria
            };

            // Adiciona ao array
            filmes.push(filme);

            // Cria um item na lista
            let item = document.createElement("li");
            item.textContent = `${nome} | Gênero: ${genero} | Nota: ${nota}/10 | Assistiria novamente: ${assistiria}`;

            // Adiciona o item na lista na tela
            lista.appendChild(item);

            // Mostra o array no console
            console.log(filmes);

            // Limpa o formulário para o próximo preenchimento
            formulario.reset();
        });
    </script>

</body>
</html>
